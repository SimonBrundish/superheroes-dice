<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Superheroes Level Dice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@500;600;800&display=swap">
<style>
/* Layout: one centred stage. Year picker on top, dice in the middle, the revealed hero card replaces the dice. */
:root {
  color-scheme: dark;
  /* StrengthLab brand colours */
  --orange: #F29224; --red: #BA181F; --dblue: #2B2F6D; --lblue: #1172B7; --green: #48AE4D; --silver: #DADADA;
  --ink: #23275c;        /* page ground, a shade under brand dark blue */
  --ink-2: var(--dblue); /* raised panels */
  --paper: #ffffff;      /* card + dice faces */
  --line: #454b9a;
  --text: #ffffff;
  --muted: var(--silver);
  --pow: var(--orange);  /* action colour */
  --hero: var(--lblue);  /* changes per character */
  --display: "Bangers", "Impact", "Arial Black", sans-serif;
  --body: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 1.5px) 0 0 / 14px 14px,
    var(--ink);
  color: var(--text);
  font-family: var(--body);
  font-size: 18px;
  padding-inline: 16px;
  padding-block: 20px 28px;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; justify-items: center; }
header { text-align: center; display: grid; gap: 6px; justify-items: center; }
.logo { width: 92px; height: auto; display: block; filter: drop-shadow(3px 3px 0 rgba(0,0,0,.35)); }
.stripe { display: flex; width: 100%; height: 6px; border-radius: 3px; overflow: hidden; }
.stripe i { flex: 1; }
.eyebrow { font-weight: 600; letter-spacing: .18em; text-transform: uppercase; font-size: 13px; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 9vw, 56px); line-height: .95; letter-spacing: .03em; margin: 0; color: #fff; text-shadow: 3px 3px 0 #000; text-wrap: balance; }

.picker { width: 100%; display: grid; gap: 8px; }
.picker-label { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: 13px; color: var(--muted); }
.picker-label b { color: var(--text); font-weight: 800; letter-spacing: .04em; font-size: 15px; font-variant-numeric: tabular-nums; }
.years { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.years button.all small { color: var(--muted); }
.years button, .heroes button {
  font: inherit; cursor: pointer; border: 2px solid var(--line); background: var(--ink-2); color: var(--text);
  border-radius: 10px; padding: 8px 0; font-weight: 800; transition: transform .1s, background .15s, border-color .15s;
}
.years button { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .04em; line-height: 1; padding: 9px 0 7px; }
.years button small { display: block; font-family: var(--body); font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--muted); }
.years button[aria-pressed="true"] { background: var(--pow); border-color: var(--pow); color: #111; }
.years button[aria-pressed="true"] small { color: #4a2a00; }
.heroes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.heroes button { padding: 3px; aspect-ratio: 1; overflow: hidden; display: grid; place-items: center; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.heroes button img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; border-radius: 6px; display: block; }
.heroes .any { font-family: var(--display); font-size: 34px; color: var(--orange); line-height: 1; padding-top: 4px; }
.heroes button[aria-pressed="true"] { border-color: var(--pow); box-shadow: 0 0 0 2px var(--pow); }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
button:active { transform: scale(.96); }

/* Stage */
.stage { width: 100%; display: grid; place-items: center; min-height: 380px; position: relative; perspective: 900px; }
.dice-box { display: grid; place-items: center; gap: 18px; }
.dice { width: 150px; height: 150px; position: relative; transform-style: preserve-3d; transform: rotateX(-24deg) rotateY(32deg); }
.dice.rolling { animation: roll 1.6s cubic-bezier(.2,.7,.25,1) forwards; }
@keyframes roll {
  0%   { transform: rotateX(-24deg) rotateY(32deg) translateY(0); }
  30%  { transform: rotateX(500deg) rotateY(380deg) rotateZ(90deg) translateY(-40px); }
  70%  { transform: rotateX(980deg) rotateY(650deg) rotateZ(160deg); }
  100% { transform: rotateX(1080deg) rotateY(720deg) rotateZ(360deg); }
}
.face {
  position: absolute; inset: 0; background: var(--paper); color: #111; border: 4px solid #111; border-radius: 22px;
  display: grid; place-items: center; font-family: var(--display); font-size: 84px; line-height: 1; padding-top: 6px;
  box-shadow: inset 0 0 0 6px var(--silver);
  backface-visibility: hidden;
}
.face small { position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-family: var(--body); font-weight: 800; font-size: 12px; letter-spacing: .2em; color: #666; }
.f1 { transform: rotateY(0deg) translateZ(75px); }
.f2 { transform: rotateY(90deg) translateZ(75px); }
.f3 { transform: rotateY(180deg) translateZ(75px); }
.f4 { transform: rotateY(-90deg) translateZ(75px); }
.f5 { transform: rotateX(90deg) translateZ(75px); }
.f6 { transform: rotateX(-90deg) translateZ(75px); }
.face.hero-face { padding: 0; overflow: hidden; }
.face.hero-face img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
.shadow { width: 130px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.45); filter: blur(6px); }

.spin {
  font-family: var(--display); font-size: 34px; letter-spacing: .06em; line-height: 1;
  padding: 14px 44px 10px; border: 3px solid #000; border-radius: 14px; cursor: pointer;
  background: var(--pow); color: #111; box-shadow: 5px 5px 0 #000; transition: transform .1s, box-shadow .1s;
}
.spin:hover { transform: translate(-1px,-1px); box-shadow: 6px 6px 0 #000; }
.spin:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 #000; }
.spin[disabled] { opacity: .6; cursor: default; }

/* Card */
.card {
  width: min(300px, 100%); background: var(--paper); color: #111; border: 4px solid #111; border-radius: 18px;
  box-shadow: 8px 8px 0 #000; overflow: hidden; display: grid; grid-template-rows: auto auto;
  transform-origin: 50% 60%;
}
.card.show { animation: reveal .55s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes reveal { from { transform: rotateY(90deg) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.card-art { position: relative; aspect-ratio: 4 / 5; background: var(--hero); max-width: 100%; }
.card-art img { width: 100%; height: 100%; object-fit: cover; object-position: center 40%; display: block; }
.badge {
  position: absolute; right: 12px; bottom: 12px; width: 96px; height: 96px; display: grid; place-items: center;
  background: #fff; color: #111; border: 4px solid #111; font-family: var(--display); font-size: 58px; line-height: 1; padding-top: 6px;
  clip-path: polygon(50% 0, 61% 18%, 82% 8%, 80% 30%, 100% 36%, 85% 52%, 100% 68%, 79% 72%, 82% 94%, 61% 84%, 50% 100%, 39% 84%, 18% 94%, 21% 72%, 0 68%, 15% 52%, 0 36%, 20% 30%, 18% 8%, 39% 18%);
}
.badge-inner { transform: rotate(-6deg); }
.card-foot { padding: 12px 16px 14px; display: grid; gap: 2px; border-top: 4px solid #111; background: var(--paper); }
.card-foot .lvl { font-family: var(--display); font-size: 32px; line-height: 1.02; letter-spacing: .03em; text-wrap: balance; margin-top: 2px; }
.card-foot .tag { font-weight: 800; text-transform: uppercase; letter-spacing: .14em; font-size: 12px; color: var(--hero); filter: brightness(.8); }
.card-foot .meta { font-weight: 600; text-transform: uppercase; letter-spacing: .12em; font-size: 13px; color: #555; display: flex; justify-content: space-between; gap: 8px; }
.card-foot .video { margin-top: 8px; font-weight: 800; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: #111; border-radius: 8px; padding: 8px 10px; text-align: center; text-decoration: none; }
.card-foot .video:hover, .card-foot .video:focus-visible { background: var(--hero); outline: none; }
.card-foot .meta b { color: var(--hero-dark, #111); }
.again { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.ghost { font: inherit; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; padding: 10px 18px; border-radius: 10px; border: 2px solid var(--line); background: var(--ink-2); color: var(--text); cursor: pointer; }
.result-box { display: grid; justify-items: center; }
.timer { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 14px; flex-wrap: wrap; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: 13px; }
.timer button { font: inherit; font-weight: 800; letter-spacing: .06em; padding: 7px 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--ink-2); color: var(--text); cursor: pointer; }
.timer .count { font-family: var(--display); font-size: 44px; letter-spacing: .04em; color: #fff; line-height: 1; min-width: 2.2ch; text-align: center; font-variant-numeric: tabular-nums; }
.timer .count.done { color: var(--orange); }
.tools { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; }
.tools button { font: inherit; font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 10px; border-radius: 8px; border: 2px solid var(--line); background: var(--ink-2); color: var(--text); cursor: pointer; }
body:fullscreen, :fullscreen body { overflow: auto; }

.history { width: 100%; font-size: 14px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; min-height: 22px; }
.history span { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; }
.history span b { color: var(--text); }

@media (max-width: 440px) {
  .years { gap: 4px; }
  .years button { font-size: 18px; }
  .years button small { font-size: 8px; letter-spacing: .04em; }
  .tools { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .dice.rolling { animation-duration: .01s; }
  .card.show { animation: none; }
}
/* Compact mode for small embeds: add #compact or ?compact=1 */
.compact header { display: none; }
.video-pop { width: min(900px, 94vw); padding: 0; border: 4px solid #111; border-radius: 16px; background: #000; color: #fff; box-shadow: 8px 8px 0 #000; }
.video-pop::backdrop { background: rgba(0,0,0,.75); }
.video-pop .pop-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; background: var(--hero); }
.video-pop .pop-title { font-family: var(--display); font-size: 24px; letter-spacing: .03em; line-height: 1.05; }
.video-pop .pop-close { font: inherit; font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; padding: 6px 12px; border-radius: 8px; border: 2px solid #111; background: #fff; color: #111; cursor: pointer; }
.video-pop .pop-frame { aspect-ratio: 16 / 9; background: #000; display: grid; place-items: center; }
.video-pop iframe { width: 100%; height: 100%; border: 0; display: block; }
.video-pop .pop-missing { padding: 24px; text-align: center; font-weight: 600; }
.video-pop .pop-foot { padding: 8px 12px; font-size: 13px; text-align: right; }
.video-pop .pop-foot a { color: #DADADA; }
button.video { font: inherit; cursor: pointer; border: 0; width: 100%; }
</style>
</head>

  "Smash With Double Press Ups, Double L-M-R-M To Jump",
  "Smash With Double Press Ups, Double Twisters To Jump",
  "Smash With Double Press Ups, Double M-W-M To Jump",
  "Smash With Double Press Ups, Double Scorpions To Lunge",
  "Smash With Double Press Ups, Double L-M-R-M To Lunge",
  "Smash With Double Press Ups, Double Twisters To Lunge",
  "Smash With Double Press Ups, Double M-W-M To Lunge"
 ]
};

// Vimeo video for each level, per hero (null = new video needed)
const VIDEOS = {
 "ironman": ["175238442", "175238444", "175238445", "175238446", "176029068", "175763979", "175727574", "175727580", "175819648", "175821445", "175823374", "175727572", "223947100", "223782659", "223783443", "223778682", "223781928", "223780631", "223779478", "223784027", "223781652", "223784706", "223785417", "223947404"],
 "spiderman": ["175268471", "175268472", "175727571", "175268607", "176174840", "223800440", "175772336", "223801264", "175772335", "175772333", "223801806", "175773818", "223806034", "175268474", "223806034", "175772334", "175774988", "176174838", "223799706", "223804816", "223798576", "223802479", "223803549", "223807253"],
 "thor": ["175305126", "175305122", "175305123", "175305124", "176036367", "176075853", "176081060", "176085256", "176085259", "176036368", "176036369", "176036371", "223785788", "223789879", "223790361", "223791222", "223792339", "223788779", "223794155", "223794531", "223795761", "223796800", "223793473", "223789410"],
 "superman": ["175311189", "175311186", "175311187", "175311188", "176174846", "223948247", "175727576", "176174839", "223797607", "176174836", "176174841", "176174837", "223948828", "176174847", null, "223949289", "223950268", "223951188", "223952000", "223950497", "223952682", "223952342", "223953455", "223948156"],
 "hulk": ["184862501", "175317955", "175317957", "175318926", "176220722", "176220716", "176224371", "176220719", "176220723", "176224370", "176220713", "176224375", "223808323", "223809036", "223809893", "223810959", "223814207", "223811940", "223813114", "223815359", "223816080", "223817173", "223818274", "223819419"]
};
const YEARS = 6, PER_YEAR = 4, ALL = 0;   // year 0 means every level, 1–24

const $ = id => document.getElementById(id);
let year = 1, heroChoice = "random", rolling = false, last = null;

// Start-up options from the link: ?year=3 or #year3 (?year=all or #all), ?hero=hulk, ?compact=1 or #compact
(function readOptions() {
  const q = new URLSearchParams(location.search), h = location.hash.toLowerCase();
  const y = parseInt(q.get("year") || (h.match(/year(\d)/) || [])[1], 10);
  if (y >= 1 && y <= YEARS) year = y;
  if ((q.get("year") || "").toLowerCase() === "all" || /(^#|year)all/.test(h)) year = ALL;
  const hero = (q.get("hero") || (h.match(/(superman|spiderman|hulk|thor|ironman)/) || [])[1] || "").toLowerCase();
  if (HEROES.some(x => x.id === hero)) heroChoice = hero;
  if (q.get("compact") === "1" || h.includes("compact")) document.body.classList.add("compact");
})();

const range = y => y === ALL ? [1, YEARS * PER_YEAR] : [ (y - 1) * PER_YEAR + 1, y * PER_YEAR ];
const yearName = y => y === ALL ? "All levels" : `Year ${y}`;

function renderYears() {
  $("years").innerHTML = "";
  for (let y = 1; y <= YEARS; y++) {
    const [a, b] = range(y);
    const btn = document.createElement("button");
    btn.type = "button"; btn.id = "year-" + y;
    btn.setAttribute("aria-pressed", y === year);
    btn.setAttribute("aria-label", `Year ${y}, levels ${a} to ${b}`);
    btn.innerHTML = `Y${y}<small>L${a}–${b}</small>`;
    btn.onclick = () => { if (rolling) return; year = y; renderYears(); setDiceFaces(); showDice(); };
    $("years").appendChild(btn);
  }
  const all = document.createElement("button");
  all.type = "button"; all.id = "year-all"; all.className = "all";
  all.setAttribute("aria-pressed", year === ALL);
  all.setAttribute("aria-label", "All levels, 1 to 24");
  all.innerHTML = `All<small>L1–24</small>`;
  all.onclick = () => { if (rolling) return; year = ALL; renderYears(); setDiceFaces(); showDice(); };
  $("years").appendChild(all);
  const [a, b] = range(year);
  $("rangeLabel").textContent = year === ALL ? "All levels · 1–24" : `Year ${year} · Levels ${a}–${b}`;
}

function renderHeroes() {
  $("heroes").innerHTML = "";
  const opts = [{ id: "random", name: "Random hero" }, ...HEROES];
  opts.forEach(h => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.id = "hero-" + h.id;
    btn.setAttribute("aria-pressed", h.id === heroChoice);
    btn.setAttribute("aria-label", h.name);
    btn.title = h.name;
    btn.innerHTML = h.img ? `<img src="${h.img}" alt="">` : `<span class="any">?</span>`;
    btn.onclick = () => { if (rolling) return; heroChoice = h.id; renderHeroes(); setDiceFaces(); showDice(); };
    $("heroes").appendChild(btn);
  });
  $("heroLabel").textContent = heroChoice === "random" ? "Random hero" : HEROES.find(h => h.id === heroChoice).name;
}

// Dice: four faces carry this year's level numbers, two carry hero art.
function setDiceFaces(resultLevel) {
  const [a, b] = range(year);
  let levels;
  if (year === ALL) {
    // four different levels from 1–24, with the result on the front face
    const pool = Array.from({ length: b }, (_, i) => i + 1).filter(n => n !== resultLevel).sort(() => Math.random() - .5);
    levels = resultLevel ? [resultLevel, ...pool.slice(0, 3)] : [1, 8, 16, 24];
  } else {
    levels = [a, a + 1, a + 2, a + 3];
    if (resultLevel) { levels.splice(levels.indexOf(resultLevel), 1); levels.unshift(resultLevel); }
  }
  const pool = heroChoice === "random" ? HEROES : HEROES.filter(h => h.id === heroChoice);
  const faces = [
    { cls: "f1", n: levels[0] }, { cls: "f2", n: levels[1] }, { cls: "f3", n: levels[2] }, { cls: "f4", n: levels[3] },
    { cls: "f5", hero: pool[0] }, { cls: "f6", hero: pool[pool.length > 1 ? 3 : 0] },
  ];
  $("dice").innerHTML = faces.map(f => f.hero
    ? `<div class="face hero-face ${f.cls}"><img src="${f.hero.img}" alt=""></div>`
    : `<div class="face ${f.cls}"><small>LEVEL</small>${f.n}</div>`).join("");
}

function showDice() {
  $("resultBox").hidden = true; $("diceBox").hidden = false;
  $("dice").classList.remove("rolling");
}

function pick() {
  const [a, b] = range(year);
  let level, hero, tries = 0;
  do {
    level = a + Math.floor(Math.random() * (b - a + 1));
    hero = heroChoice === "random" ? HEROES[Math.floor(Math.random() * HEROES.length)] : HEROES.find(h => h.id === heroChoice);
  } while (last && last.level === level && last.hero === hero && ++tries < 20);
  return { level, hero, year };
}

function roll() {
  if (rolling) return;
  rolling = true;
  stopTimer(true);
  const result = pick();
  showDice();
  setDiceFaces(result.level);
  const dice = $("dice");
  void dice.offsetWidth;          // restart the animation
  dice.classList.add("rolling");
  $("spinBtn").disabled = true;
  const dur = matchMedia("(prefers-reduced-motion: reduce)").matches ? 50 : 1750;
  setTimeout(() => reveal(result), dur);
}

function reveal(r) {
  last = r;
  document.documentElement.style.setProperty("--hero", r.hero.color);
  $("cardImg").src = r.hero.img;
  $("cardImg").alt = r.hero.name;
  $("cardNum").textContent = r.level;
  $("cardTitle").textContent = EXERCISES[r.hero.id][r.level - 1];
  $("cardHero").textContent = `${r.hero.name} · Level ${r.level} of 24`;
  $("cardYear").textContent = yearName(r.year);
  $("diceBox").hidden = true; $("resultBox").hidden = false;
  const card = $("card");
  card.classList.remove("show"); void card.offsetWidth; card.classList.add("show");
  $("spinBtn").disabled = false;
  rolling = false;
  const chip = document.createElement("span");
  chip.title = EXERCISES[r.hero.id][r.level - 1];
  chip.innerHTML = `${r.year === ALL ? "All" : "Y" + r.year} · <b>L${r.level}</b> ${r.hero.name}`;
  $("history").prepend(chip);
  while ($("history").children.length > 6) $("history").lastChild.remove();
  $("againBtn").focus({ preventScroll: true });
}

$("spinBtn").onclick = roll;
$("againBtn").onclick = roll;

// Exercise video in a pop-up
function openVideo() {
  if (!last) return;
  const { hero, level } = last, id = VIDEOS[hero.id][level - 1];
  $("popTitle").textContent = `${hero.name} ${level}: ${EXERCISES[hero.id][level - 1]}`;
  $("popSite").href = `https://www.strengthlabsuperheroes.com/exercises?superhero=${hero.site}&level=${level}`;
  $("popFrame").innerHTML = id
    ? `<iframe src="https://player.vimeo.com/video/${id}?autoplay=1&title=0&byline=0&portrait=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Exercise video"></iframe>`
    : `<p class="pop-missing">A new video for this level is on its way.</p>`;
  $("videoPop").showModal();
}
function closeVideo() { $("videoPop").close(); }
$("cardVideo").onclick = openVideo;
$("popClose").onclick = closeVideo;
$("videoPop").addEventListener("close", () => { $("popFrame").innerHTML = ""; $("cardVideo").focus({ preventScroll: true }); });
$("videoPop").addEventListener("click", e => { if (e.target === e.currentTarget) closeVideo(); });

// Space bar rolls (when focus is not already on a button)
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !$("videoPop").open && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); roll(); }
});

// Practice timer with a beep at the end
let timerId = null, audio = null;
function beep() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach((d, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = i === 2 ? 1040 : 780; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(.25, audio.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + d + .22);
      o.start(audio.currentTime + d); o.stop(audio.currentTime + d + .23);
    });
  } catch (e) {}
}
function setTimerUI(running) {
  ["t30", "t45", "t60"].forEach(id => $(id).hidden = running);
  $("tStop").hidden = !running; $("timerCount").hidden = !running && !$("timerCount").classList.contains("done");
  $("timerLabel").hidden = running || $("timerCount").classList.contains("done");
}
function stopTimer(reset) {
  clearInterval(timerId); timerId = null;
  if (reset) $("timerCount").classList.remove("done");
  setTimerUI(false);
}
function startTimer(secs) {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  let left = secs;
  $("timerCount").classList.remove("done");
  $("timerCount").textContent = left;
  setTimerUI(true);
  timerId = setInterval(() => {
    left--; $("timerCount").textContent = left;
    if (left <= 0) {
      clearInterval(timerId); timerId = null;
      $("timerCount").textContent = "Done!"; $("timerCount").classList.add("done");
      beep(); setTimerUI(false);
    }
  }, 1000);
}
["t30", "t45", "t60"].forEach(id => $(id).onclick = () => startTimer(+$(id).dataset.s));
$("tStop").onclick = () => stopTimer(true);

// Full screen, for showing the dice on a projector or whiteboard
if (document.fullscreenEnabled) {
  $("fsBtn").hidden = false;
  $("fsBtn").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
  document.addEventListener("fullscreenchange", () => $("fsBtn").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen");
}
renderYears(); renderHeroes(); setDiceFaces();
</script>
